name: CMake CI

on:
  push:
    branches: [ "main" ]
  pull_request:

env:
  CMAKE_VERSION: "4.2.0"
  NINJA_VERSION: "1.13.0"

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        compiler: [ g++-16, clang++-23 ]
        build_type: [ Debug, Release ]

    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install cmake==${{ env.CMAKE_VERSION }} ninja==${{ env.NINJA_VERSION }}

      - name: Install GCC
        if: matrix.compiler == 'g++-16'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-16 g++-16

      - name: Install Clang
        if: matrix.compiler == 'clang++-23'
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 23
          sudo apt-get install -y clang-tools-23

      - name: Configure
        run: >
          cmake -B build -G Ninja
          -DCMAKE_CXX_COMPILER=${{ matrix.compiler }}
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure --no-tests=error
