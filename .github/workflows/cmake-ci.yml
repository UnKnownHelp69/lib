name: CMake CI

on:
  push:
    branches: [ "main" ]
  pull_request:

env:
  CMAKE_VERSION: "4.2.0"
  NINJA_VERSION: "1.13.0"

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        toolchain:
          # TODO configure clang
          - os: ubuntu-24.04
            compiler: g++14

          - os: windows
            compiler: cl

        build_type: [Debug, Release]

    runs-on: ${{ matrix.toolchain.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install cmake==${{ env.CMAKE_VERSION }} ninja==${{ env.NINJA_VERSION }}

      - name: Setup MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        run: >
          cmake -B build -G Ninja
          -DCMAKE_CXX_COMPILER=${{ matrix.toolchain.compiler }}
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure --no-tests=error
